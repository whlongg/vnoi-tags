<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Danh sách bài tập lập trình theo chủ đề của VNOI">
    <title>VNOI Tag Project</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><text y=%2252%22 font-size=%2252%22>🏷️</text></svg>">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="./">VNOI <span>Tag Project</span></a>
      <a href="https://oj.vnoi.info/problems/">Kho bài VNOJ ↗</a>
    </header>
    <main>
      <div class="title-row">
        <div><p class="eyebrow">Kho tham khảo thuật toán</p><h1>Tag problem list</h1></div>
        <output id="result-count">Đang tải…</output>
      </div>
      <div class="layout">
        <section class="catalog" aria-labelledby="catalog-title">
          <h2 id="catalog-title" class="sr-only">Danh sách bài</h2>
          <nav id="pagination" class="pagination" aria-label="Phân trang"></nav>
          <p id="status" role="status"></p>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Mã bài</th><th>Tên bài</th><th>OJ</th></tr></thead>
              <tbody id="problem-rows"></tbody>
            </table>
          </div>
        </section>
        <aside>
          <form id="filters">
            <h2>Tìm bài</h2>
            <label for="search">Mã hoặc tên bài</label>
            <input id="search" name="search" type="search" placeholder="Ví dụ: segment tree">
            <label for="judge">Online judges</label>
            <select id="judge" name="judge" multiple></select>
            <div class="actions">
              <button type="submit">Lọc</button>
              <button id="random" type="button">Random</button>
              <button id="clear" type="button" class="quiet">Xóa lọc</button>
            </div>
          </form>
          <div id="tag-groups" class="tag-groups"></div>
        </aside>
      </div>
    </main>
    <footer>Dữ liệu được lưu tĩnh từ VNOI Tag Project.</footer>
  </body>
</html>
